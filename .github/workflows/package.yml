name: packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/tests.yml

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make dpkg-dev lintian
      - name: Build .deb
        run: ./packaging/build-deb.sh
      - name: Lint .deb
        run: lintian --fail-on error dist/*.deb
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gannotate-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: gannotate-deb
          path: dist
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.deb dist/SHA256SUMS \
              --title "Gannotate ${tag#v}" \
              --generate-notes
          fi
